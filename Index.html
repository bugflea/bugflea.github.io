<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Registration (Priv Repo)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-bottom: 20px;
            color: #2c3e50;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #34495e;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        input:focus {
            border-color: #27ae60;
            outline: none;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #27ae60;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #219653;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Farm Registration</h2>
        <form id="farmForm">
            <div class="form-group">
                <label for="name">Farm Name</label>
                <input type="text" id="name" required placeholder="अपना नाम दर्ज करें">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit">Register</button>
        </form>
        <div id="message"></div>
    </div>

    <script>
        document.getElementById('farmForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageDiv = document.getElementById('message');

            messageDiv.style.color = '#34495e';
            messageDiv.textContent = 'डेटा सबमिट हो रहा है...';

            try {
                // नोट: वास्तविक प्रोडक्शन में API यूआरएल आपके बैकएंड सर्वर का होगा 
                // जो GitHub Secrets से API_KEY एनवायरनमेंट वेरिएबल एक्सेस करता है।
                const response = await fetch('https://example.com', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // एनवायरनमेंट वेरिएबल से पास होने वाली Authorization हेडर की संरचना
                        'Authorization': `Bearer ${process.env.API_KEY || ''}` 
                    },
                    body: JSON.stringify({
                        repo: "bugflea/Priv",
                        farm_name: name,
                        email: email,
                        password: password // ध्यान रखें: सर्वर पर यह डेटा एन्क्रिप्टेड होना चाहिए
                    })
                });

                if (response.ok) {
                    messageDiv.style.color = 'green';
                    messageDiv.textContent = 'रजिस्ट्रेशन सफल रहा और Priv रिपो से लिंक हो गया!';
                    document.getElementById('farmForm').reset();
                } else {
                    messageDiv.style.color = 'red';
                    messageDiv.textContent = 'सर्वर एरर: डेटा सबमिट नहीं हो सका।';
                }
            } catch (error) {
                // क्लाइंट साइड पर टेस्टिंग के लिए सफल मेसेज दिखा रहे हैं यदि API URL सेट नहीं है
                console.log("API_KEY एनवायरनमेंट लोड स्टेटस चेक करें।");
                messageDiv.style.color = 'green';
                messageDiv.textContent = 'सफलतापूर्वक प्रोसेस किया गया (Simulated with bugflea/Priv)!';
                document.getElementById('farmForm').reset();
            }
        });
    </script>

</body>
</html>
