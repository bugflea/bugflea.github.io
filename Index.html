<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Name & Email Form</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; color: #e2e8f0;
    }
    .card {
      background: #1e293b; border-radius: 16px; padding: 40px;
      width: 100%; max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 1px solid #334155;
    }
    h1 { font-size: 1.6rem; margin-bottom: 8px; text-align: center; }
    p.subtitle { text-align: center; color: #94a3b8; margin-bottom: 30px; font-size: 0.95rem; }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #cbd5e1; }
    input {
      width: 100%; padding: 12px 16px; border-radius: 10px;
      border: 1px solid #475569; background: #0f172a; color: #f1f5f9;
      font-size: 1rem; outline: none;
    }
    input:focus { border-color: #3b82f6; }
    button {
      width: 100%; padding: 14px; background: #3b82f6; color: white;
      border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
      cursor: pointer; margin-top: 10px;
    }
    button:hover { background: #2563eb; }
    button:disabled { background: #64748b; cursor: not-allowed; }
    .message {
      margin-top: 20px; padding: 12px; border-radius: 8px;
      text-align: center; font-size: 0.95rem; display: none;
    }
    .message.success { background: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
    .message.error { background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Name & Email Form</h1>
    <p class="subtitle">bugflea / Priv → GitHub Actions</p>

    <form id="submitForm">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="Your full name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>
      <button type="submit" id="submitBtn">Submit</button>
    </form>

    <div id="message" class="message"></div>
  </div>

  <script>
    // ============================================
    // CONFIG
    // ============================================
    const GITHUB_USERNAME = 'bugflea';
    const REPO_NAME = 'Priv';
    
    // Yeh token sirf repository_dispatch trigger karne ke liye chahiye
    // Scope: repo (private repo ke liye)
    // Best practice: isko frontend mein mat rakho, serverless function use karo
    const DISPATCH_TOKEN = 'YOUR_GITHUB_PAT_HERE';   // ← yahan apna PAT daalo

    // ============================================
    const form = document.getElementById('submitForm');
    const submitBtn = document.getElementById('submitBtn');
    const messageEl = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();

      if (!name || !email) {
        showMessage('Please fill both fields', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      try {
        const response = await fetch(
          `https://api.github.com/repos/\( {GITHUB_USERNAME}/ \){REPO_NAME}/dispatches`,
          {
            method: 'POST',
            headers: {
              'Accept': 'application/vnd.github+json',
              'Authorization': `Bearer ${DISPATCH_TOKEN}`,
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              event_type: 'form_submission',          // ← workflow isko sunega
              client_payload: {
                name: name,
                email: email,
                submitted_at: new Date().toISOString()
              }
            })
          }
        );

        if (response.status === 204) {
          showMessage('Success! Data GitHub Actions ko bhej diya gaya.', 'success');
          form.reset();
        } else {
          const err = await response.json();
          throw new Error(err.message || `HTTP ${response.status}`);
        }

      } catch (error) {
        console.error(error);
        showMessage('Error: ' + error.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit';
      }
    });

    function showMessage(text, type) {
      messageEl.textContent = text;
      messageEl.className = `message ${type}`;
      messageEl.style.display = 'block';
    }
  </script>
</body>
</html>
